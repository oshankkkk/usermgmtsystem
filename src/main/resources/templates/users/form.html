<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 760px;">
    <h1 class="h3 mb-4" th:text="${title}">Create user</h1>

    <form th:action="@{${formAction}}" th:object="${user}" method="post" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="firstName">First name</label>
                <input type="text" class="form-control" th:field="*{firstName}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{firstName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="lastName">Last name</label>
                <input type="text" class="form-control" th:field="*{lastName}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{lastName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" th:field="*{username}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="phone">Phone (optional)</label>
                <input type="text" class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="role">Role</label>
                <select class="form-select" th:field="*{role}" th:errorclass="is-invalid">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">USER</option>
                </select>
                <div class="invalid-feedback" th:errors="*{role}"></div>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" th:field="*{active}">
                    <label class="form-check-label" for="active">Active</label>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save user</button>
            <a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
