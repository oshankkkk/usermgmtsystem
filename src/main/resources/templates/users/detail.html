<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('User details')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 760px;">
    <h1 class="h3 mb-4" th:text="${user.firstName + ' ' + user.lastName}">Name</h1>

    <dl class="row">
        <dt class="col-sm-3">ID</dt>
        <dd class="col-sm-9" th:text="${user.id}">1</dd>
        <dt class="col-sm-3">Email</dt>
        <dd class="col-sm-9" th:text="${user.email}">email</dd>
        <dt class="col-sm-3">Username</dt>
        <dd class="col-sm-9" th:text="${user.username}">username</dd>
        <dt class="col-sm-3">Phone</dt>
        <dd class="col-sm-9" th:text="${user.phone} ?: 'Not provided'">phone</dd>
        <dt class="col-sm-3">Role</dt>
        <dd class="col-sm-9" th:text="${user.role}">USER</dd>
        <dt class="col-sm-3">Status</dt>
        <dd class="col-sm-9" th:text="${user.active} ? 'Active' : 'Inactive'">Active</dd>
        <dt class="col-sm-3">Created</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">date</dd>
        <dt class="col-sm-3">Last updated</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}">date</dd>
    </dl>

    <a class="btn btn-primary" th:href="@{/users/{id}/edit(id=${user.id})}">Edit</a>
    <a class="btn btn-outline-danger" th:href="@{/users/{id}/delete(id=${user.id})}">Delete</a>
    <a class="btn btn-outline-secondary" th:href="@{/users}">Back to list</a>
</div>
</body>
</html>
