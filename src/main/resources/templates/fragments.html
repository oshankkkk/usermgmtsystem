<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | User Management'">User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/users}">User Management</a>
        <a class="btn btn-success btn-sm" th:href="@{/users/new}">New user</a>
    </div>
</nav>

<table>
    <tr>
        <!-- Clickable column header: toggles sort direction -->
        <th th:fragment="sortable(field, label)">
            <a class="text-decoration-none text-dark"
               th:href="@{/users(page=0, size=${page.size}, sortBy=${field}, dir=${(sortBy == field and dir == 'asc') ? 'desc' : 'asc'}, keyword=${keyword})}"
               th:text="${label}">Label</a>
            <span th:if="${sortBy == field}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
        </th>
    </tr>
</table>

</body>
</html>
